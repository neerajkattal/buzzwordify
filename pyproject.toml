[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buzzwordify"
version = "0.1.0"
description = "Turn what you actually did into insufferable LinkedIn hustle-speak."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Neeraj Kattal" }]

[project.scripts]
buzzwordify = "buzzwordify:main"

[tool.setuptools]
packages = ["buzzwordify"]
